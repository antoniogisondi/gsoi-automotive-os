# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-gsoi"
BBFILE_PATTERN_meta-gsoi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-gsoi = "6"

LAYERDEPENDS_meta-gsoi = "core"
LAYERSERIES_COMPAT_meta-gsoi = "wrynose"
