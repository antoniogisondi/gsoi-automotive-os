# Drop-in installato da gsoi-model.
#
# Quando gsoi-model e' presente nell'immagine, jarvis-mini usa il cervello
# LLM locale invece del mock, e parte dopo il server del modello. Se il
# server non e' pronto, jarvis-mini si avvia comunque (Wants, non Requires)
# e ripiega automaticamente sul mock finche' il modello non risponde.
[Unit]
After=gsoi-model.service
Wants=gsoi-model.service

[Service]
Environment=JARVIS_AI=local
Environment=JARVIS_MODEL_URL=http://127.0.0.1:8091/v1
Environment=JARVIS_MODEL_NAME=qwen3-4b-instruct
